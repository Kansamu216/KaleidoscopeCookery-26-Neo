name: Build

on:
  push:
    branches:
      - '26.1.2'
      - '26.2'
      - '26.3'
      - 'port/**'
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - '26.1.2'
      - '26.2'
      - '26.3'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # The build uses a JDK 26 toolchain for NeoForm Runtime (createMinecraftArtifacts)
      # while compiling mod sources for Java 25. Both runtimes must be available.
      - name: Setup JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      - name: Setup JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build with Gradle
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.java.installations.paths=${{ env.JAVA_HOME_25_X64 }},${{ env.JAVA_HOME_26_X64 }}
