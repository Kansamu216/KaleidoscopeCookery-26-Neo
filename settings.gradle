pluginManagement {
    repositories {
        // A Maven Central mirror is listed first because the Gradle Plugin Portal
        // redirects its transitive dependencies to Maven Central, which rate-limits
        // hosted CI runners with HTTP 429.
        maven {
            name = 'GoogleMavenCentralMirror'
            url = uri('https://maven-central.storage-download.googleapis.com/maven2/')
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}
